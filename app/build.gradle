plugins { id 'com.android.application' }

android {
    namespace 'com.norsky.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.norsky.master"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { }
